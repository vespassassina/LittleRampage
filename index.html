<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Bangers', 'Comic Sans MS', system-ui, sans-serif;
    background: radial-gradient(circle at 30% 25%, #4a36a8 0%, #22185a 50%, #0e0a2b 100%);
    color: #fff;
  }
  #halftone {

  h1 {

  }
  @media (max-width: 600px) { h1 { font-size: 34px; } #hint { display: none; } button { font-size: 17px; padding: 5px 10px; } }

  #hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; gap: 8px; align-items: stretch; }
  #hud .box {
    background: #fff; color: #000; border: 3px solid #000; border-radius: 12px; box-shadow: 3px 3px 0 #000;
    padding: 4px 12px; font-size: 18px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }

  #hud button { font-size: 18px; padding: 4px 10px; }
  #pop {
    position: fixed; left: 50%; top: 32%; z-index: 3; pointer-events: none; opacity: 0;
    font-size: 54px; color: #ffd93d; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #000; white-space: nowrap;
    transform: translate(-50%, 0) rotate(-4deg);
  }
  #pop.show { animation: pop 1.1s ease-out; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, 20px) rotate(-4deg) scale(.5); }
    15% { opacity: 1; transform: translate(-50%, 0) rotate(-4deg) scale(1.15); }

  }

  #panel .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ?test: used by tests.html so runs are repeatable (no auto-rotate drift).
const TEST_MODE = new URLSearchParams(location.search).has('test');

const V3 = THREE.Vector3;
const UP = new V3(0, 1, 0);
const R = 10;            // planet radius (sea level)
const HC = R + 0.32;     // height of city plateaus

// ---------- helpers ----------
let seed = 20260923;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

function randomDir() {
  const u = rand() * 2 - 1, t = rand() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  return new V3(s * Math.cos(t), u, s * Math.sin(t));
}
function tangentBasis(n) {
  const a = Math.abs(n.y) < 0.9 ? UP : new V3(1, 0, 0);
  const t1 = new V3().crossVectors(a, n).normalize();
  return [t1, new V3().crossVectors(n, t1)];
}
// Gnomonic map from a tangent plane at `center` onto the sphere; returns a unit direction.
function planeMap(center, radius) {
  const [t1, t2] = tangentBasis(center);
  const map = (x, z) => center.clone().multiplyScalar(radius).addScaledVector(t1, x).addScaledVector(t2, z).normalize();
  return { map, t1, t2 };
}
// Matrix with +Y = up, +Z = forward (projected onto the tangent plane), at pos.
function frameAt(pos, up, fwd, sx = 1, sy = sx, sz = sx) {
  const f = fwd.clone().addScaledVector(up, -fwd.dot(up)).normalize();
  const r = new V3().crossVectors(up, f);
  return new THREE.Matrix4().makeBasis(r, up, f).scale(new V3(sx, sy, sz)).setPosition(pos);
}

// ---------- noise ----------
function hash3(x, y, z) { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t, c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
  return 2 * L(
    L(L(c(0,0,0), c(1,0,0), u), L(c(0,1,0), c(1,1,0), u), v),
    L(L(c(0,0,1), c(1,0,1), u), L(c(0,1,1), c(1,1,1), u), v), w) - 1;
}
function fbm(x, y, z, oct) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.02; a *= 0.5; }
  return s;
}

// ---------- cities (defined first: they flatten the terrain) ----------
const CITIES = [
  { dir: new V3(0.35, 0.75, 0.55).normalize(), Lr: 3.4 },
  { dir: new V3(-0.8, -0.1, 0.6).normalize(), Lr: 2.4 },
  { dir: new V3(0.25, -0.55, -0.8).normalize(), Lr: 2.4 },
];
for (const c of CITIES) {
  Object.assign(c, planeMap(c.dir, HC));
  c.cap = Math.atan((c.Lr + 0.32) / HC);
  c.inner = c.cap + 0.05;
  c.outer = c.inner + 0.22;
}

function rawHeight(d) {
  const e = fbm(d.x * 1.6 + 3.1, d.y * 1.6 - 1.7, d.z * 1.6 + 0.4, 5) + 0.04;
  if (e <= 0) return R + e * 3.0;
  const ridge = clamp(1 - Math.abs(fbm(d.x * 2.2 + 7, d.y * 2.2, d.z * 2.2 - 5, 3) * 2.4), 0, 1);
  return R + e * 1.2 + Math.pow(ridge, 3) * 1.9 * smooth(0.1, 0.3, e);
}
function heightAt(d) {
  let h = rawHeight(d);
  for (const c of CITIES) {
    const a = d.angleTo(c.dir);
    if (a < c.outer) h += (HC - h) * (1 - smooth(c.inner, c.outer, a));
  }
  return h;
}
const nearCity = (d, pad = 0) => CITIES.some(c => d.angleTo(c.dir) < c.outer + pad);

// ---------- renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), grad = g.createRadialGradient(150, 120, 0, 256, 256, 420);
  grad.addColorStop(0, '#4a36a8'); grad.addColorStop(0.5, '#22185a'); grad.addColorStop(1, '#0e0a2b');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  scene.background = new THREE.CanvasTexture(c);
  scene.background.colorSpace = THREE.SRGBColorSpace;
}
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 1000);
camera.position.copy(CITIES[0].dir).multiplyScalar(30).add(new V3(4, 6, 8));
if (camera.aspect < 1) camera.position.multiplyScalar(0.8 / camera.aspect);   // fit the planet on a portrait phone
scene.add(camera);

scene.add(new THREE.AmbientLight('#bdb6ff', 1.0));
const sun = new THREE.DirectionalLight('#fff4dc', 2.3);
sun.position.set(-7, 9, 5);   // over the viewer's left shoulder: the lit side always faces us
camera.add(sun);

// ---------- comic materials ----------
function ramp(steps) {
  const data = new Uint8Array(steps.length * 4);
  steps.forEach((v, i) => data.set([v, v, v, 255], i * 4));
  const t = new THREE.DataTexture(data, steps.length, 1);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const RAMP = ramp([105, 185, 255]);
const SOFT_RAMP = ramp([205, 238, 255]);   // clouds and smoke: bands, but never grey

const matCache = new Map();
function toon(color, map = null, gradientMap = RAMP) {
  const k = color + (map ? map.uuid : '') + gradientMap.uuid;
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshToonMaterial({ color, map, gradientMap }));
  return matCache.get(k);
}

// Inverted-hull ink line. Width grows with camera distance so it stays ~2 px,
// capped at maxW world units so small things don't drown in black.
const inkCache = new Map();
function ink(maxW) {
  if (!inkCache.has(maxW)) inkCache.set(maxW, new THREE.ShaderMaterial({
    uniforms: { maxW: { value: maxW }, color: { value: new THREE.Color('#15102a') } },
    vertexShader: `
      uniform float maxW;
      void main() {
        mat4 m = modelMatrix;
        #ifdef USE_INSTANCING
          m = m * instanceMatrix;
        #endif
        vec4 wp = m * vec4(position, 1.0);
        vec3 wn = normalize(mat3(m) * normal);
        wp.xyz += wn * min(0.0024 * distance(wp.xyz, cameraPosition), maxW);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `uniform vec3 color; void main() { gl_FragColor = vec4(color, 1.0); }`,
    side: THREE.BackSide,
  }));
  return inkCache.get(maxW);
}
// Hull geometry needs welded, smoothed normals or it cracks at hard edges.
const hullCache = new Map();
function hullGeo(geo) {
  if (!hullCache.has(geo)) {
    let o = new THREE.BufferGeometry();
    o.setAttribute('position', geo.attributes.position.clone());
    if (geo.index) o.setIndex(geo.index.clone());
    o = mergeVertices(o);
    o.computeVertexNormals();
    hullCache.set(geo, o);
  }
  return hullCache.get(geo);
}
function inked(geo, mat, maxW = 0.03) {
  const m = new THREE.Mesh(geo, mat);
  m.add(new THREE.Mesh(hullGeo(geo), ink(maxW)));
  return m;
}

// Static things are merged per material: a few dozen draw calls for a whole world.
// ALL_INK_MESHES holds every merged outline mesh with its ink width, so the quality
// switch can drop thin outlines (e.g. tree trunks) under a size threshold in low mode.
const ALL_INK_MESHES = [];
class Batch {
  constructor() { this.byMat = new Map(); this.byInk = new Map(); }
  add(geo, mat, matrix, maxW = 0.03) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!this.byMat.has(mat)) this.byMat.set(mat, []);
    this.byMat.get(mat).push(g.applyMatrix4(matrix));
    if (maxW) {
      if (!this.byInk.has(maxW)) this.byInk.set(maxW, []);
      this.byInk.get(maxW).push(hullGeo(geo).toNonIndexed().applyMatrix4(matrix));
    }
  }
  build(parent) {
    for (const [mat, geos] of this.byMat) parent.add(new THREE.Mesh(mergeGeometries(geos), mat));
    for (const [w, geos] of this.byInk) {
      const m = new THREE.Mesh(mergeGeometries(geos), ink(w));
      parent.add(m);
      ALL_INK_MESHES.push({ mesh: m, w });
    }
  }
}

const PALETTE = ['#ff6b6b', '#ffd93d', '#6bcbef', '#a66cff', '#ff9f43', '#4ecdc4', '#f78fb3', '#9be15d', '#ff7eb6', '#5ab0ff'];
const GREENS = ['#5ccf5a', '#3fb35a', '#86dc4e', '#2f9e5b'];

// ---------- terrain and sea ----------
{
  let g = new THREE.IcosahedronGeometry(1, 90);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const pos = g.attributes.position, cols = new Float32Array(pos.count * 3);
  const d = new V3(), col = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    d.fromBufferAttribute(pos, i).normalize();
    const h = heightAt(d), a = h - R;
    if (a < -0.3) col.set('#2a63b8');
    else if (a < 0) col.set('#8fe3d6');
    else if (a < 0.1) col.set('#ffe29a');
    else if (a < 0.95) col.set(fbm(d.x * 6, d.y * 6, d.z * 6, 2) > 0 ? '#7bd85a' : '#55c15a');
    else if (a < 1.6) col.set(a < 1.25 ? '#c0916a' : '#9b8fb8');
    else col.set('#ffffff');
    pos.setXYZ(i, d.x * h, d.y * h, d.z * h);
    cols.set([col.r, col.g, col.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  const terrain = new THREE.Mesh(g, new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: RAMP }));
  terrain.add(new THREE.Mesh(g, ink(0.08)));
  scene.add(terrain);

  const seaGeo = new THREE.SphereGeometry(R, 128, 96);
  const sea = new THREE.Mesh(seaGeo, new THREE.MeshToonMaterial({
    color: '#3cb0f0', gradientMap: RAMP, transparent: true, opacity: 0.84 }));
  sea.add(new THREE.Mesh(seaGeo, ink(0.08)));
  scene.add(sea);
}

// Stepped comic halo.
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.2, 64, 48),
  new THREE.ShaderMaterial({
    uniforms: { fade: { value: 1 } },
    vertexShader: `varying vec3 vN; varying vec3 vP;
      void main() { vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vP = mv.xyz; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float fade; varying vec3 vN; varying vec3 vP;
      void main() {
        float i = pow(clamp(0.72 - abs(dot(normalize(-vP), vN)), 0.0, 1.0), 1.6) * 2.2;
        i = floor(i * 3.0) / 3.0;
        gl_FragColor = vec4(vec3(0.45, 0.85, 1.0) * i * fade, 1.0);
      }`,
    side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
scene.add(atmosphere);

// Stars
{
  const n = 700, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) randomDir().multiplyScalar(rr(160, 220)).toArray(p, i * 3);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#fff8d0', size: 2, sizeAttenuation: false })));
}

// ---------- building blocks ----------
function windowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#1c2340'; g.fillRect(14, 12, 36, 42);
  g.fillStyle = '#a8dcff'; g.fillRect(18, 16, 28, 34);
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(22, 46); g.lineTo(36, 20); g.lineTo(42, 20); g.lineTo(28, 46); g.fill();
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const WIN = windowTexture();
const WIN_W = 0.2, WIN_H = 0.22;   // world size of one window cell

function windowBox(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d).translate(0, h / 2, 0), uv = g.attributes.uv;
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    if (f === 2 || f === 3) { uv.setXY(i, 0.02, 0.02); continue; }   // roof and floor: plain wall
    const su = Math.max(1, Math.round((f < 2 ? d : w) / WIN_W)), sv = Math.max(1, Math.round(h / WIN_H));
    uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  }

}
function windowCylinder(r, h) {
  const seg = 16, g = new THREE.CylinderGeometry(r, r, h, seg).translate(0, h / 2, 0), uv = g.attributes.uv;
  const side = (seg + 1) * 2;
  const su = Math.max(3, Math.round(2 * Math.PI * r / WIN_W)), sv = Math.max(1, Math.round(h / WIN_H));
  for (let i = 0; i < uv.count; i++) {
    if (i < side) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
    else uv.setXY(i, 0.02, 0.02);
  }
  return g;
}

function addBuilding(B, m, fp, centrality) {

// ---------- closed paths for traffic ----------
class Loop {
  constructor(pts) {
    this.pts = pts; this.cum = [0];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      this.cum.push(this.cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
    this.total = this.cum[pts.length];
  }
  at(s) {
    s = ((s % this.total) + this.total) % this.total;
    let i = 0; while (this.cum[i + 1] < s) i++;
    const a = this.pts[i], b = this.pts[(i + 1) % this.pts.length];
    const t = (s - this.cum[i]) / (this.cum[i + 1] - this.cum[i] || 1);
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }
}
const circle = (r, n = 72, dir = 1) => Array.from({ length: n }, (_, i) => {
  const a = dir * i / n * Math.PI * 2; return [r * Math.cos(a), r * Math.sin(a)];
});

function initCarInstancing() {
  // Create instanced meshes for car parts.

  // Shared cab mesh (all cabins are light blue)
  const cabMat = toon('#cdefff');
  const cabGeo = CAR_CAB;
  carInstances.cabs.mesh = new THREE.InstancedMesh(cabGeo, cabMat, MAX_CARS);
  carInstances.cabs.mesh.castShadow = true;

  // Shared wheels mesh (all wheels are dark)
  const wheelMat = toon('#26233a');
  const wheelGeo = WHEELS;
  carInstances.wheels.mesh = new THREE.InstancedMesh(wheelGeo, wheelMat, MAX_CARS);
  carInstances.wheels.mesh.castShadow = true;
  scene.add(carInstances.wheels.mesh);

  // Ink outlines for cabs and wheels (shared across all cars)
  const cabInkMat = ink(0.01);
  const cabInkGeo = hullGeo(CAR_CAB);
  carInstances.inkCabs.mesh = new THREE.InstancedMesh(cabInkGeo, cabInkMat, MAX_CARS);
  scene.add(carInstances.inkCabs.mesh);

  const wheelInkMat = ink(0.006);
  const wheelInkGeo = hullGeo(WHEELS);
  carInstances.inkWheels.mesh = new THREE.InstancedMesh(wheelInkGeo, wheelInkMat, MAX_CARS);
  scene.add(carInstances.inkWheels.mesh);

function getOrCreateBodyInstance(color) {
  if (!carInstances.bodies.has(color)) {
    const mat = toon(color);
    const geo = CAR_BODY;
    const mesh = new THREE.InstancedMesh(geo, mat, MAX_CARS);
    mesh.castShadow = true;
    scene.add(mesh);
    carInstances.bodies.set(color, { mesh, count: 0, instances: [] });

    // Create ink outline for this color
    const inkMat = ink(0.01);
    const inkGeo = hullGeo(CAR_BODY);
    const inkMesh = new THREE.InstancedMesh(inkGeo, inkMat, MAX_CARS);
    scene.add(inkMesh);
    carInstances.inkBodies.set(color, { mesh: inkMesh, count: 0 });
  }
  return carInstances.bodies.get(color);
}

function addCarInstance(color) {
  const bodyData = getOrCreateBodyInstance(color);

  // Allocate instance indices
  const bodyIndex = bodyData.count;
  const cabIndex = carInstances.cabs.count;
  const wheelIndex = carInstances.wheels.count;

  // Track this car
  const carDescriptor = {
    color,
    bodyIndex,
    cabIndex,
    wheelIndex,
  };

  bodyData.instances.push(carDescriptor);
  bodyData.count++;
  bodyData.mesh.count = bodyData.count;

  carInstances.cabs.count++;
  carInstances.cabs.mesh.count = carInstances.cabs.count;

  carInstances.wheels.count++;
  carInstances.wheels.mesh.count = carInstances.wheels.count;

  // Update ink outline counters and mesh counts
  const bodyInkData = carInstances.inkBodies.get(color);
  bodyInkData.count++;
  bodyInkData.mesh.count = bodyInkData.count;

  carInstances.inkCabs.count++;
  carInstances.inkCabs.mesh.count = carInstances.inkCabs.count;

  carInstances.inkWheels.count++;
  carInstances.inkWheels.mesh.count = carInstances.inkWheels.count;

  return carDescriptor;
}

const world = new Batch();
const P = 0.85, SW = 0.13;          // block pitch, half street width
const PAD = new THREE.BoxGeometry(P - 2 * SW, 0.04, P - 2 * SW).translate(0, 0.02, 0);
const DASH = new THREE.BoxGeometry(0.016, 0.004, 0.08);

function buildCity(c) {
  const top = HC + 0.012, Lin = c.Lr - 0.22, K = Math.ceil(c.Lr / P);
  const at = (x, z, lift = 0) => c.map(x, z).multiplyScalar(top + lift);
  const frm = (x, z, lift = 0) => frameAt(at(x, z, lift), c.map(x, z), c.t2);

  // asphalt disc
  const q = new THREE.Quaternion().setFromUnitVectors(UP, c.dir);
  world.add(new THREE.SphereGeometry(top, 72, 10, 0, Math.PI * 2, 0, c.cap), toon('#5d6275'),
    new THREE.Matrix4().makeRotationFromQuaternion(q), null);

  // lane markings: grid streets and the ring boulevard
  const white = toon('#ffffff');
  for (let k = -K; k <= K; k++) for (let t = -Lin; t <= Lin; t += 0.2) {
    const s = k * P;
    if (Math.hypot(s, t) > Lin) continue;
    world.add(DASH, white, frm(s, t, 0.002), null);
    world.add(DASH, white, frameAt(at(t, s, 0.002), c.map(t, s), c.t1), null);
  }
  for (const [x, z] of circle(c.Lr + 0.07, 110)) {
    const [nx, nz] = [-z, x];
    world.add(DASH, white, frameAt(at(x, z, 0.002), c.map(x, z), c.map(x + nx * 0.01, z + nz * 0.01).sub(c.map(x, z))), null);
  }

  // blocks
  const pad = P - 2 * SW;
  c.maxH = 0;
  for (let i = -K; i < K; i++) for (let j = -K; j < K; j++) {
    const cx = (i + 0.5) * P, cz = (j + 0.5) * P;
    if (Math.hypot(Math.abs(cx) + P / 2, Math.abs(cz) + P / 2) > Lin) continue;
    const centrality = 1 - Math.hypot(cx, cz) / c.Lr;
    const park = rand() < 0.14;
    world.add(PAD, toon(park ? '#7bd85a' : '#ece3cf'), frm(cx, cz), 0.02);
    if (park) {
      for (let n = 0; n < 5; n++) {
        const x = cx + rr(-0.22, 0.22), z = cz + rr(-0.22, 0.22);
        addTree(world, at(x, z, 0.03), c.map(x, z), rr(0.8, 1.1));
      }
      continue;
    }
    if (rand() < 0.4) {
      c.maxH = Math.max(c.maxH, addBuilding(world, frm(cx, cz, 0.04), pad * 0.7, centrality));
    } else {
      for (const [ox, oz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        if (rand() < 0.12) continue;   // an empty lot now and then
        c.maxH = Math.max(c.maxH, addBuilding(world, frm(cx + ox * pad / 4, cz + oz * pad / 4, 0.04), pad / 2 * 0.78, centrality));
      }
    }
  }

  // suburbs on the grass around the city
  for (let n = 0; n < 70; n++) {
    const a = rr(0, Math.PI * 2), r = rr(c.Lr + 0.55, c.Lr + 2.2);
    const x = r * Math.cos(a), z = r * Math.sin(a), d = c.map(x, z), h = heightAt(d);
    if (h < R + 0.1) continue;
    const pos = d.clone().multiplyScalar(h - 0.02);
    if (rand() < 0.35) addHouse(world, frameAt(pos, d, randomDir()), rr(0.2, 0.28));
    else addTree(world, pos, d, rr(0.8, 1.2));
  }

  // traffic
  const loops = [new Loop(circle(c.Lr, 96, 1)), new Loop(circle(c.Lr + 0.14, 96, -1))];
  for (let tries = 0; tries < 60 && loops.length < 8; tries++) {
    const i1 = Math.floor(rr(-K, K)), i2 = i1 + 1 + Math.floor(rand() * 3);
    const j1 = Math.floor(rr(-K, K)), j2 = j1 + 1 + Math.floor(rand() * 3);
    const corners = [[i1, j1], [i2, j1], [i2, j2], [i1, j2]].map(([i, j]) => [i * P, j * P]);
    if (corners.some(([x, z]) => Math.hypot(x, z) > Lin - 0.05)) continue;
    const e = 0.065;   // lane offset from the centre line
    loops.push(new Loop([[i1 * P + e, j1 * P + e], [i2 * P - e, j1 * P + e], [i2 * P - e, j2 * P - e], [i1 * P + e, j2 * P - e]]));
  }
  loops.forEach((loop, li) => {
    const n = li < 2 ? Math.round(loop.total / 3) : 2;
    for (let k = 0; k < n; k++) {
      const color = pick([...PALETTE, '#ffffff', '#ffd93d']);
      const carDesc = addCarInstance(color);
      vehicles.car.push(carDesc);  // store descriptor for tests
      let s = loop.total * k / n + rr(0, 0.3);
      const speed = rr(0.3, 0.45);
      movers.push((t, dt) => {
        s += speed * dt;
        const [x, z] = loop.at(s), [x2, z2] = loop.at(s + 0.04);
        const up = c.map(x, z), pos = up.clone().multiplyScalar(top);
        const mat = frameAt(pos, up, c.map(x2, z2).multiplyScalar(top).sub(pos));

        // Update instance matrices for all car parts
        const bodyData = carInstances.bodies.get(carDesc.color);
        bodyData.mesh.setMatrixAt(carDesc.bodyIndex, mat);
        bodyData.mesh.instanceMatrix.needsUpdate = true;
        carInstances.inkBodies.get(carDesc.color).mesh.setMatrixAt(carDesc.bodyIndex, mat);
        carInstances.inkBodies.get(carDesc.color).mesh.instanceMatrix.needsUpdate = true;

        carInstances.cabs.mesh.setMatrixAt(carDesc.cabIndex, mat);
        carInstances.cabs.mesh.instanceMatrix.needsUpdate = true;
        carInstances.inkCabs.mesh.setMatrixAt(carDesc.cabIndex, mat);
        carInstances.inkCabs.mesh.instanceMatrix.needsUpdate = true;

        carInstances.wheels.mesh.setMatrixAt(carDesc.wheelIndex, mat);
        carInstances.wheels.mesh.instanceMatrix.needsUpdate = true;
        carInstances.inkWheels.mesh.setMatrixAt(carDesc.wheelIndex, mat);
        carInstances.inkWheels.mesh.instanceMatrix.needsUpdate = true;
      });
    }
  });
}

function gameStep(dt, t) {
  const k = G.keys;
  const turn = (k.has('right') ? 1 : 0) - (k.has('left') ? 1 : 0);
  const climb = (k.has('up') ? 1 : 0) - (k.has('down') ? 1 : 0);
  if (G.running) {
    G.f.applyAxisAngle(G.p, -turn * TURN * dt);                 // negative angle about "up" = clockwise from above
    advance(G.p, G.f, SPEED * dt, G.alt);
    G.alt = clamp(G.alt + climb * CLIMB * dt, skyFloor(G.p), CEIL);
  }
  G.bank += (turn * 0.55 - G.bank) * Math.min(1, dt * 5);
  syncPlaneTransform();
  playerBody.userData.prop.rotation.z += dt * 40;
  rules.step(dt, t);
}

function placeRing(r, onRoute) {

    const q = new THREE.Quaternion().setFromUnitVectors(G.p, G.town.dir);
    d = G.p.clone().applyQuaternion(new THREE.Quaternion().slerp(q, 0.25 + Math.random() * 0.6));
    d.addScaledVector(gdir(), 0.08).normalize();
  } else d = gdir();
  r.dir = d;
  const alt = Math.max(skyFloor(d) + 0.3, R + 2.4 + Math.random() * 2);
  frameAt(d.clone().multiplyScalar(Math.min(alt, CEIL - 0.3)), d, gdir()).decompose(r.mesh.position, r.mesh.quaternion, r.mesh.scale);
}
function pickTown() {
  const far = TOWNS.filter(t => t !== G.town && t.dir.angleTo(G.p) > 0.7);

  const bonus = dist / SPEED * Math.max(1.15, 1.8 - G.score * 0.06) + 4;
  G.time += bonus;

  frameAt(d.clone().multiplyScalar(heightAt(d)), d, tangentBasis(d)[0]).decompose(beacon.position, beacon.quaternion, beacon.scale);
  rings.slice(0, 3).forEach(r => placeRing(r, true));
  return bonus;
}

  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.font = '86px Bangers, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = 14; g.strokeStyle = '#15102a'; g.strokeText(word, 128, 66);
  g.fillStyle = '#ffd93d'; g.fillText(word, 128, 66);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const WORDS = { pop: ['POP!'], boom: ['BOOM!', 'POW!', 'KABLAM!'] };
const WORD_TEX = {};
for (const w of [...WORDS.pop, ...WORDS.boom]) WORD_TEX[w] = wordTexture(w);
const FIREBALL = new THREE.IcosahedronGeometry(1, 1);
const bursts = Array.from({ length: 10 }, () => {
  const g = new THREE.Group();
  const fire = inked(FIREBALL, toon('#ff9f43', null, SOFT_RAMP), 0.02);
  const core = new THREE.Mesh(FIREBALL, toon('#fff27a', null, SOFT_RAMP));
  core.scale.setScalar(0.7); core.position.z = 0.35; fire.add(core);   // core leans towards the camera side
  const word = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false }));
  word.renderOrder = 10;
  g.add(fire, word); g.visible = false; scene.add(g);
  return { g, fire, word, age: 99, size: 1 };
});
let nextBurst = 0;
function burst(pos, kind) {
  const b = bursts[nextBurst]; nextBurst = (nextBurst + 1) % bursts.length;
  b.g.position.copy(pos); b.g.visible = true; b.age = 0; b.size = kind === 'pop' ? 0.3 : 0.55;
  b.word.material.map = WORD_TEX[pick(WORDS[kind])];
}
movers.push((t, dt) => {
  for (const b of bursts) {
    if (!b.g.visible) continue;
    b.age += dt;
    const k = b.age / 0.9;
    if (k >= 1) { b.g.visible = false; continue; }
    b.fire.scale.setScalar(b.size * smooth(0, 0.2, k) * (1 - smooth(0.45, 1, k)));
    b.fire.quaternion.copy(camera.quaternion);
    const w = b.size * 2.4 * (0.6 + 0.4 * smooth(0, 0.15, k));
    b.word.scale.set(w, w / 2, 1);
    b.word.position.copy(camera.up).multiplyScalar(b.size * 1.2);
    b.word.material.opacity = 1 - smooth(0.7, 1, k);
  }
});

// ---------- Sky Raid (see docs/specs/sky-raid.md) ----------
const SHOT_SPEED = 7, SHOT_RANGE = 4.2, FIRE_GAP = 0.14, HIT_R = 0.35, TRAINING = 8;

const shotMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.07, 0.07, 0.4),
  new THREE.MeshBasicMaterial({ color: '#fff27a' }), 40);
shotMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
shotMesh.frustumCulled = false; shotMesh.visible = false; scene.add(shotMesh);
const shots = Array.from({ length: shotMesh.count }, () => ({ p: new V3(), f: new V3(), alt: 0, life: 0 }));
const shotWorld = (s, out = new V3()) => out.copy(s.p).multiplyScalar(s.alt);
let fireWait = 0;
const _shotM = new THREE.Matrix4();

function fire() {
  const s = shots.find(s => s.life <= 0);
  if (!s) return;
  s.p.copy(G.p); s.f.copy(G.f); s.alt = G.alt - 0.02; s.life = SHOT_RANGE / SHOT_SPEED;
  advance(s.p, s.f, 0.3, s.alt);   // leave from the nose, not the cockpit
}

// Target balloons: red and white, all sharing one texture.
const TARGET_TEX = stripes('#e8263b', '#ffffff');
const balloons = Array.from({ length: TRAINING }, () => {
  const mesh = makeBalloon('#e8263b', TARGET_TEX); mesh.visible = false; scene.add(mesh);
  return { mesh, dir: new V3(), base: new V3(), alive: false, ph: Math.random() * 6 };
});
// Spread around the start town, at heights the plane can reach.
function placeBalloons() {
  const [t1, t2] = tangentBasis(CITIES[0].dir);
  balloons.forEach((b, i) => {
    const ang = 0.12 + i * 0.06, bear = Math.random() * 6.283;
    b.dir.copy(CITIES[0].dir).multiplyScalar(Math.cos(ang))
      .addScaledVector(t1, Math.sin(ang) * Math.cos(bear)).addScaledVector(t2, Math.sin(ang) * Math.sin(bear)).normalize();
    const alt = Math.min(skyFloor(b.dir) + rr(0.1, 1.2), CEIL - 0.5);
    b.base.copy(b.dir).multiplyScalar(alt);
    b.mesh.position.copy(b.base); b.mesh.quaternion.setFromUnitVectors(UP, b.dir);
    b.alive = b.mesh.visible = true;
  });
}
function nearest(list) {
  let best = null, bd = Infinity;
  for (const x of list) { const d = x.mesh.position.distanceToSquared(player.position); if (d < bd) { bd = d; best = x; } }
  return best;
}
const enemies = [];

GAMES.raid = {
  title: 'Sky Raid', key: 'lw-sky-raid-best', best: loadBest('lw-sky-raid-best'),
  intro: 'Training first: pop the 8 red target balloons. Space fires. ' +
    '← → steer · ↑ ↓ climb and dive · Esc quits.',
  start() {
    G.lives = 3; fireWait = 0;
    shots.forEach(s => s.life = 0);
    shotMesh.visible = true;
    placeBalloons();
  },
  stop() {
    shots.forEach(s => s.life = 0);
    shotMesh.visible = false;
    balloons.forEach(b => b.alive = b.mesh.visible = false);
  },
  step(dt, t) {
    fireWait -= dt;
    if (G.running && G.keys.has('fire') && fireWait <= 0) { fire(); fireWait = FIRE_GAP; }

    const m = _shotM;
    shots.forEach((s, i) => {
      if (s.life > 0) {
        s.life -= dt;
        advance(s.p, s.f, SHOT_SPEED * dt, s.alt);
        shotWorld(s, _pos);
        for (const b of balloons) if (b.alive && b.mesh.position.distanceTo(_pos) < HIT_R) {
          b.alive = b.mesh.visible = false; s.life = 0;
          burst(b.mesh.position, 'pop');
          G.score += 2;
        }
      }
      if (s.life > 0) m.copy(frameAt(shotWorld(s, _pos), s.p, s.f));
      else m.makeScale(0, 0, 0);
      shotMesh.setMatrixAt(i, m);
    });
    shotMesh.instanceMatrix.needsUpdate = true;

    for (const b of balloons) if (b.alive)
      b.mesh.position.copy(b.base).addScaledVector(b.dir, Math.sin(t * 1.3 + b.ph) * 0.08);

    const left = balloons.filter(b => b.alive);
    if (G.running && !left.length) this.end();
    hud.lives.textContent = '♥'.repeat(G.lives);
    hud.points.textContent = G.score;
    const n = nearest(left);
    if (n) pointAt(n.dir, `Balloons ${left.length}`);
  },
  // Sprint 1 stops after training; waves of enemies come next.
  end() {
    G.running = false;
    recordBest();
    panel('Training done!', `All ${TRAINING} balloons popped, ${G.score} points. ` +
      'Enemy waves come next. They are not in the game yet.', 'Train again');
  },
};
LW.game = G;
LW.V3 = V3;
LW.player = player;
LW.games = { open: openGame, start: startRun, quit: quitGame };
LW.courier = { openGame: () => openGame('courier'), startRun, quitGame, endRun: () => GAMES.courier.end(), rings, TOWNS, skyFloor };
LW.raid = { balloons, shots, enemies, bursts, fire, shotWorld };
LW.touch = {
  el: touchEl, joystick, fireBtn,
  setStick: setStickKeys, firePress: setFireKey,
  get forceShow() { return touchForceShow; },
  set forceShow(v) { touchForceShow = v; updateTouchVisibility(); },
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- quality (AC 4: High/Low performance switch) ----------
// Low: halves traffic, drops thin ink outlines, caps pixel ratio at 1.5.
const QUALITY_KEY = 'lw-quality', LOW_INK_MAXW = 0.015;
function loadQuality() {
  try {
    const v = localStorage.getItem(QUALITY_KEY);
    return (v === 'low' || v === 'high') ? v : 'high';
  } catch { return 'high'; }   // storage blocked: default to high for this visit only
}
let qualityLevel = loadQuality();
const qbtn = $('qbtn');

function applyQuality(level) {
  qualityLevel = level;
  const low = level === 'low';
  renderer.setPixelRatio(low ? Math.min(devicePixelRatio, 1.5) : Math.min(devicePixelRatio, 2));
  // Halve traffic, but never hide whatever vehicle the camera is currently chasing.
  for (const key of ['car', 'boat', 'plane']) {
    vehicles[key].forEach((v, i) => { v.visible = !low || i % 2 === 0 || v === target; });
  }
  for (const { mesh, w } of ALL_INK_MESHES) mesh.visible = !low || w >= LOW_INK_MAXW;
  if (qbtn) { qbtn.textContent = `Quality: ${low ? 'Low' : 'High'}`; qbtn.classList.toggle('on', low); }
}

LW.quality = {
  get: () => qualityLevel,
  set(level) {
    applyQuality(level);
    try { localStorage.setItem(QUALITY_KEY, level); } catch { /* not saved: session-only */ }
  },
  auto: {
    enabled: false,   // fires at most once per session
    elapsed: 0,       // seconds since load, ticked by the real loop below
    // Pure-ish: called with a measured avg frame time. Switches to low once, past the
    // 3s warm-up window, if frames are running slower than 25ms on average.
    checkAuto(avgFrameMs) {
      if (this.enabled || this.elapsed < 3) return null;
      if (avgFrameMs > 25) { LW.quality.set('low'); this.enabled = true; return 'low'; }
      return null;
    },
  },
};
if (qbtn) qbtn.onclick = () => LW.quality.set(LW.quality.get() === 'low' ? 'high' : 'low');
applyQuality(qualityLevel);

// ---------- loop ----------
const clock = new THREE.Clock();
const tmp = new V3(), tmp2 = new V3();
let avgFrameMs = 16;   // rolling estimate, fed to the auto quality switch
function frame(fixedDt) {
  const dt = fixedDt ?? Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (const f of movers) f(t, dt);

  // Real auto-switch: only on real gameplay frames (not test-driven fixed steps),
  // and only on touch/coarse-pointer devices per spec — desktop never auto-switches.
  if (!TEST_MODE && fixedDt === undefined) {
    avgFrameMs += (dt * 1000 - avgFrameMs) * 0.1;
    LW.quality.auto.elapsed += dt;
    if (window.matchMedia('(pointer: coarse)').matches) LW.quality.auto.checkAuto(avgFrameMs);
  }
  if (mode === 'game') gameStep(dt, t);

  let alt = camera.position.length() - R;
  if (mode === 'orbit') {
    controls.rotateSpeed = clamp(alt / 14, 0.06, 0.9);
    controls.zoomSpeed = clamp(alt / 10, 0.4, 1.2);
    controls.update();
    // never inside a mountain or a skyscraper
    const d = tmp.copy(camera.position).normalize();
    let floor = Math.max(heightAt(d), R) + 0.25;
    for (const c of CITIES) if (d.angleTo(c.dir) < c.cap + 0.05) floor = Math.max(floor, HC + c.maxH + 0.3);
    if (camera.position.length() < floor) camera.position.setLength(floor);
    alt = camera.position.length() - R;
    // close to the ground, tip the view up towards the horizon
    camera.rotateX((1 - smooth(1.2, 7, alt)) * 1.05);
  } else {
    target.updateWorldMatrix(true, false);
    const c = target.userData.chase ?? CHASE[mode];
    // glide over the surface, never through the planet: blend direction and height separately
    const want = target.localToWorld(tmp.copy(c.off)), k = 1 - Math.exp(-dt * 4);
    const len = THREE.MathUtils.lerp(camera.position.length(), want.length(), k);
    camera.position.normalize().lerp(want.normalize(), k).setLength(len);
    camera.up.lerp(tmp2.setFromMatrixPosition(target.matrixWorld).normalize(), 1 - Math.exp(-dt * 5)).normalize();
    camera.lookAt(target.localToWorld(tmp.copy(c.look)));
    alt = camera.position.length() - R;
  }
  camera.near = clamp(alt * 0.08, 0.01, 2);
  camera.updateProjectionMatrix();
  atmosphere.material.uniforms.fade.value = smooth(3, 8, alt);

  renderer.render(scene, camera);
}
// In test mode, nothing drives frame() but the test runner's own LW.frame(dt) calls.
// A live rAF loop running underneath would sneak extra, unaccounted frames in between
// a test's manual steps — this pane throttles rAF irregularly, so that showed up as
// a flaky test rather than a clean failure or a clean pass.
if (!TEST_MODE) renderer.setAnimationLoop(() => frame());
LW.frame = frame;
LW.makeCar = makeCar;   // expose for tests
LW.addCarInstance = addCarInstance;   // expose for tests
LW.ready = true;   // last thing set: tests.html polls this before running checks
</script>
</body>
</html>
