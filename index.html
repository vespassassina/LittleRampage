<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ?test: used by tests.html so runs are repeatable (no auto-rotate drift).
const TEST_MODE = new URLSearchParams(location.search).has('test');

const V3 = THREE.Vector3;
const UP = new V3(0, 1, 0);
let R = 15;             // planet radius (sea level) — planet-v2 AC1, was 10
let HC = R + 0.32;      // height of city plateaus (absolute; not scaled with R)
// Terrain noise is sampled from unit-ish direction vectors, so its wavelength in
// world units grows with R unless frequency grows to match (arc length = angle * R;
// angle per noise-cycle ~ 1/frequency, so frequency must scale with R to hold the
// arc length, i.e. a mountain's width in world units, constant). NZ is that scale
// factor, anchored to the original R=10 tuning.
let NZ = R / 10;

// ---------- helpers ----------
const INITIAL_SEED = 20260923;
let seed = INITIAL_SEED;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

function randomDir() {
  const u = rand() * 2 - 1, t = rand() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  return new V3(s * Math.cos(t), u, s * Math.sin(t));
}
function tangentBasis(n) {
  const a = Math.abs(n.y) < 0.9 ? UP : new V3(1, 0, 0);
  const t1 = new V3().crossVectors(a, n).normalize();
  return [t1, new V3().crossVectors(n, t1)];
}
// Gnomonic map from a tangent plane at `center` onto the sphere; returns a unit direction.
function planeMap(center, radius) {
  const [t1, t2] = tangentBasis(center);
  const map = (x, z) => center.clone().multiplyScalar(radius).addScaledVector(t1, x).addScaledVector(t2, z).normalize();
  return { map, t1, t2 };
}
// Matrix with +Y = up, +Z = forward (projected onto the tangent plane), at pos.
function frameAt(pos, up, fwd, sx = 1, sy = sx, sz = sx) {
  const f = fwd.clone().addScaledVector(up, -fwd.dot(up)).normalize();
  const r = new V3().crossVectors(up, f);
  return new THREE.Matrix4().makeBasis(r, up, f).scale(new V3(sx, sy, sz)).setPosition(pos);
}

// ---------- noise ----------
function hash3(x, y, z) { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t, c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
  return 2 * L(
    L(L(c(0,0,0), c(1,0,0), u), L(c(0,1,0), c(1,1,0), u), v),
    L(L(c(0,0,1), c(1,0,1), u), L(c(0,1,1), c(1,1,1), u), v), w) - 1;
}
function fbm(x, y, z, oct) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.02; a *= 0.5; }
  return s;
}

// ---------- cities (defined first: they flatten the terrain) ----------
// planet-v2 AC2: 5 cities, sized 3.4 / 2.4-3.0, none overlapping, none in the sea.
// Directions are hand-picked (as the original 3 were): searched for points with
// rawHeight(dir) - R comfortably positive (on land, not just above the 0 threshold)
// and pairwise angular separation well past outer+outer (no two ring roads touch).
// The old city 0 and city 2 sat in the sea at R=15 (rawHeight - R of -0.47 and
// +0.01) - the plateau flattening hid it, but AC2 now checks the raw terrain
// under the centre, so all 5 positions below are new, not just the 2 additions.
const CITIES = [
  { dir: new V3(0.806, 0.043, -0.590).normalize(), Lr: 3.4 },
  { dir: new V3(-0.826, -0.049, 0.562).normalize(), Lr: 3.0 },
  { dir: new V3(0.556, -0.341, 0.759).normalize(), Lr: 2.8 },
  { dir: new V3(-0.200, -0.909, -0.365).normalize(), Lr: 2.6 },
  { dir: new V3(0.148, 0.951, 0.270).normalize(), Lr: 2.4 },
];
// Everything here depends on HC, so applySize() re-runs it on a resize.
function layoutCities() {
  for (const c of CITIES) {
    Object.assign(c, planeMap(c.dir, HC));
    c.cap = Math.atan((c.Lr + 0.32) / HC);
    c.inner = c.cap + 0.05;
    c.outer = c.inner + 0.22;
    c.top = HC + 0.012;   // road surface
  }
}
layoutCities();

function rawHeight(d) {
  const f1 = 1.6 * NZ, f2 = 2.2 * NZ;
  const e = fbm(d.x * f1 + 3.1, d.y * f1 - 1.7, d.z * f1 + 0.4, 5) + 0.04;
  if (e <= 0) return R + e * 3.0;
  const ridge = clamp(1 - Math.abs(fbm(d.x * f2 + 7, d.y * f2, d.z * f2 - 5, 3) * 2.4), 0, 1);
  return R + e * 1.2 + Math.pow(ridge, 3) * 1.9 * smooth(0.1, 0.3, e);
}
// Grass shade and forest clusters are terrain features too: same NZ rule as rawHeight,
// so a meadow or a forest keeps its R=10 size in world units.
const grassNoise = d => fbm(d.x * 6 * NZ, d.y * 6 * NZ, d.z * 6 * NZ, 2);
const forestNoise = d => fbm(d.x * 4 * NZ + 11, d.y * 4 * NZ, d.z * 4 * NZ, 3);
function heightAt(d) {
  let h = rawHeight(d);
  for (const c of CITIES) {
    const a = d.angleTo(c.dir);
    if (a < c.outer) h += (HC - h) * (1 - smooth(c.inner, c.outer, a));
  }
  return h;
}
const nearCity = (d, pad = 0) => CITIES.some(c => d.angleTo(c.dir) < c.outer + pad);

// ---------- renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), grad = g.createRadialGradient(150, 120, 0, 256, 256, 420);
  grad.addColorStop(0, '#4a36a8'); grad.addColorStop(0.5, '#22185a'); grad.addColorStop(1, '#0e0a2b');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  scene.background = new THREE.CanvasTexture(c);
  scene.background.colorSpace = THREE.SRGBColorSpace;
}
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 1000);
// Start distance scales with R (planet-v2 AC3: whole planet fits at start). 3*R gave
// the old R=10 planet (30 units) a comfortable margin over its fit distance; the same
// multiplier keeps that margin at R=15.
camera.position.copy(CITIES[0].dir).multiplyScalar(3 * R).add(new V3(4, 6, 8));
if (camera.aspect < 1) camera.position.multiplyScalar(0.8 / camera.aspect);   // fit the planet on a portrait phone
scene.add(camera);
let START_CAMERA_DISTANCE = camera.position.length();   // frozen for tests (AC3): camera.position itself gets driven around by later tests
let START_CAMERA_POSITION = camera.position.clone();   // reused by the Orbit button to reset the view (Sandbox UI polish)

scene.add(new THREE.AmbientLight('#bdb6ff', 1.0));
const sun = new THREE.DirectionalLight('#fff4dc', 2.3);
sun.position.set(-7, 9, 5);   // over the viewer's left shoulder: the lit side always faces us
camera.add(sun);

// ---------- comic materials ----------
function ramp(steps) {
  const data = new Uint8Array(steps.length * 4);
  steps.forEach((v, i) => data.set([v, v, v, 255], i * 4));
  const t = new THREE.DataTexture(data, steps.length, 1);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const RAMP = ramp([105, 185, 255]);
const SOFT_RAMP = ramp([205, 238, 255]);   // clouds and smoke: bands, but never grey

const matCache = new Map();
function toon(color, map = null, gradientMap = RAMP) {
  const k = color + (map ? map.uuid : '') + gradientMap.uuid;
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshToonMaterial({ color, map, gradientMap }));
  return matCache.get(k);
}

// Inverted-hull ink line. Width grows with camera distance so it stays ~2 px,
// capped at maxW world units so small things don't drown in black.
const inkCache = new Map();
function ink(maxW) {
  if (!inkCache.has(maxW)) inkCache.set(maxW, new THREE.ShaderMaterial({
    uniforms: { maxW: { value: maxW }, color: { value: new THREE.Color('#15102a') } },
    vertexShader: `
      uniform float maxW;
      void main() {
        mat4 m = modelMatrix;
        #ifdef USE_INSTANCING
          m = m * instanceMatrix;
        #endif
        vec4 wp = m * vec4(position, 1.0);
        vec3 wn = normalize(mat3(m) * normal);
        wp.xyz += wn * min(0.0024 * distance(wp.xyz, cameraPosition), maxW);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `uniform vec3 color; void main() { gl_FragColor = vec4(color, 1.0); }`,
    side: THREE.BackSide,
  }));
  return inkCache.get(maxW);
}
// Hull geometry needs welded, smoothed normals or it cracks at hard edges.
const hullCache = new WeakMap();   // weak: batch sources are throwaway geometries, rebuilt on every resize
function hullGeo(geo) {
  if (!hullCache.has(geo)) {
    let o = new THREE.BufferGeometry();
    o.setAttribute('position', geo.attributes.position.clone());
    if (geo.index) o.setIndex(geo.index.clone());
    o = mergeVertices(o);
    o.computeVertexNormals();
    hullCache.set(geo, o);
  }

// ---------- 3D track loop for trains (slerp-based, follows terrain) ----------
const BRIDGE_DECK = 0.18;   // deck height above sea level: the pillar gap (0.18 - 0.012 - 0.05) must clear the 0.1 skip in buildTrainRail
const TUNNEL_CAP = 0.7;     // ground higher than this above sea level is tunnelled, not climbed: hills (up to about 0.5) stay open
const CITY_DEPTH = 0.15;    // under a city plateau the track runs this far below the floor, so it never clips a building
class TrainTrack {
  constructor(cities, order, lift = 0.015) {
    this.lift = lift;
    this.waypoints = [];  // V3 positions at elevated heights
    this.cum = [0];       // cumulative arc lengths

    // Interpolate between each pair of cities in order
    for (let i = 0; i < order.length; i++) {
      const idx1 = order[i], idx2 = order[(i + 1) % order.length];
      const dir1 = cities[idx1].dir, dir2 = cities[idx2].dir;

      // Determine interpolation steps: target 2-4° between waypoints
      const arcAngle = Math.acos(Math.max(-1, Math.min(1, dir1.dot(dir2))));
      const stepsPerRadian = 8;  // finer than 3-4°: the ramp into a city needs several waypoints to look like a slope
      const numSteps = Math.max(8, Math.ceil(arcAngle * stepsPerRadian));

      for (let j = 0; j <= numSteps; j++) {
        const t = j / numSteps;
        // Spherical linear interpolation (slerp) of unit directions
        let slerped;
        if (Math.abs(arcAngle) < 0.0001) {
          slerped = dir1.clone();
        } else {
          slerped = new V3();
          slerped.copy(dir1).multiplyScalar(Math.sin((1 - t) * arcAngle) / Math.sin(arcAngle));
          slerped.addScaledVector(dir2, Math.sin(t * arcAngle) / Math.sin(arcAngle));
        }

        // Rails sit on the ground. Over water the ground is the sea floor, so the track crosses on a
        // bridge deck above sea level. Under a mountain or a city plateau it runs level inside the
        // ground (a tunnel); buildTrainRail adds a portal where it goes in and out.
        let h = heightAt(slerped) + lift;
        if (h <= R + lift) h = R + BRIDGE_DECK;
        else {
          let cap = R + TUNNEL_CAP;
          for (const c of cities) cap = Math.min(cap, HC - CITY_DEPTH + 2 * smooth(c.inner, c.outer, slerped.angleTo(c.dir)));
          h = Math.min(h, cap);
        }
        const pos = slerped.multiplyScalar(h);
        this.waypoints.push(pos);

        // Accumulate arc length (chord distance)
        if (this.waypoints.length > 1) {
          const prev = this.waypoints[this.waypoints.length - 2];
          const dist = pos.distanceTo(prev);
          this.cum.push(this.cum[this.cum.length - 1] + dist);
        }
      }
    }

    // Remove the duplicate final waypoint (already at start via modulo)
    this.waypoints.pop();
    this.cum.pop();

    // Close the loop distance
    const lastWp = this.waypoints[this.waypoints.length - 1];
    const firstWp = this.waypoints[0];
    this.cum.push(this.cum[this.cum.length - 1] + lastWp.distanceTo(firstWp));

    this.total = this.cum[this.cum.length - 1];
    // Waypoints are built with cityOrder[0] sitting at internal s=0 (each hop's
    // start), but tests (and the spec's "s = (i+0.5)*segmentLength" sampling
    // convention) expect cityOrder[i] to sit at the *middle* of its segment,
    // i.e. external s=(i+0.5)*total/n. Shift the public at(s) by half an average
    // segment so a city lands mid-segment instead of at a segment boundary.
    this.halfSeg = this.total / (2 * order.length);
  }

  at(s) {
    // Shift into internal parametrization (city[order[0]] at internal s=0), then
    // wrap s to [0, total) with modulo.
    s = s - this.halfSeg;
    s = ((s % this.total) + this.total) % this.total;

    // Find the enclosing segment
    let i = 0;
    while (i < this.cum.length - 1 && this.cum[i + 1] < s) i++;

    const a = this.waypoints[i % this.waypoints.length];
    const b = this.waypoints[(i + 1) % this.waypoints.length];
    const t = (s - this.cum[i]) / (this.cum[i + 1] - this.cum[i] || 1);
    return a.clone().lerp(b, t);
  }
}

  cars: { mesh: null, count: 0 },
  inkLocos: { mesh: null, count: 0 },
  inkCars: { mesh: null, count: 0 },
};

function initTrainInstancing() {
  // Locomotive mesh
  trainInstances.locos.mesh = new THREE.InstancedMesh(TRAIN_LOCO, toon('#e8263b'), MAX_TRAINS);
  scene.add(trainInstances.locos.mesh);

  // Train cars mesh (follow behind the locomotive)
  trainInstances.cars.mesh = new THREE.InstancedMesh(TRAIN_CAR, toon('#ff6b6b'), MAX_TRAINS * 2);
  scene.add(trainInstances.cars.mesh);

  // Ink outlines
  trainInstances.inkLocos.mesh = new THREE.InstancedMesh(hullGeo(TRAIN_LOCO), ink(0.012), MAX_TRAINS);
  scene.add(trainInstances.inkLocos.mesh);

  trainInstances.inkCars.mesh = new THREE.InstancedMesh(hullGeo(TRAIN_CAR), ink(0.01), MAX_TRAINS * 2);
  scene.add(trainInstances.inkCars.mesh);
}

const NUM_TRAINS = 4;
let TRAIN_SPEED;  // set once trainTrack exists, below (needs trainTrack.total)
const CAR_OFFSET = 0.35;  // arc-length spacing for each trailing car

function initTrains() {
  initTrainInstancing();

  for (let i = 0; i < NUM_TRAINS; i++) {
    const trainDescriptor = new THREE.Object3D();
    Object.assign(trainDescriptor, { locoIndex: i });

    // Push train to vehicles array
    vehicles.train.push(trainDescriptor);

    // Initial spacing: evenly distributed around the loop
    let s = (trainTrack.total * i / NUM_TRAINS);

    movers.push((t, dt) => {
      // Advance the train along the track
      s = (s + TRAIN_SPEED * dt) % trainTrack.total;

      // Locomotive position and orientation
      const locoPos = trainTrack.at(s);
      const locoNext = trainTrack.at(s + 0.1);
      const locoDir = locoNext.clone().sub(locoPos).normalize();
      const upDir = locoPos.clone().normalize();

      const locoMat = frameAt(locoPos, upDir, locoDir);

      // Keep the phantom Object3D in sync
      locoMat.decompose(trainDescriptor.position, trainDescriptor.quaternion, trainDescriptor.scale);

      // Update locomotive instance
      trainInstances.locos.mesh.setMatrixAt(i, locoMat);
      trainInstances.locos.mesh.instanceMatrix.needsUpdate = true;
      trainInstances.inkLocos.mesh.setMatrixAt(i, locoMat);
      trainInstances.inkLocos.mesh.instanceMatrix.needsUpdate = true;

      // Two trailing cars, each at a fixed offset
      for (let carIdx = 0; carIdx < 2; carIdx++) {
        const carS = (s - CAR_OFFSET * (carIdx + 1) + trainTrack.total) % trainTrack.total;
        const carPos = trainTrack.at(carS);
        const carNext = trainTrack.at(carS + 0.1);
        const carDir = carNext.clone().sub(carPos).normalize();
        const carUp = carPos.clone().normalize();

        const carMat = frameAt(carPos, carUp, carDir);
        const carMeshIdx = i + carIdx * NUM_TRAINS;

        trainInstances.cars.mesh.setMatrixAt(carMeshIdx, carMat);
        trainInstances.cars.mesh.instanceMatrix.needsUpdate = true;
        trainInstances.inkCars.mesh.setMatrixAt(carMeshIdx, carMat);
        trainInstances.inkCars.mesh.instanceMatrix.needsUpdate = true;
      }
    });
  }
}

// ---------- cities ----------
const world = new Batch();
const P = 0.85, SW = 0.13;          // block pitch, half street width
const PAD = new THREE.BoxGeometry(P - 2 * SW, 0.04, P - 2 * SW).translate(0, 0.02, 0);
const DASH = new THREE.BoxGeometry(0.016, 0.004, 0.08);

// spawnTraffic: cars are created once, at boot. A rebuild still draws the same random
// numbers for them, so the rest of the world comes out the same as at boot.
function buildCity(c, spawnTraffic) {
  const top = c.top, Lin = c.Lr - 0.22, K = Math.ceil(c.Lr / P);
  const at = (x, z, lift = 0) => c.map(x, z).multiplyScalar(top + lift);
  const frm = (x, z, lift = 0) => frameAt(at(x, z, lift), c.map(x, z), c.t2);

  // asphalt disc
  const q = new THREE.Quaternion().setFromUnitVectors(UP, c.dir);
  world.add(new THREE.SphereGeometry(top, 72, 10, 0, Math.PI * 2, 0, c.cap), toon('#5d6275'),
    new THREE.Matrix4().makeRotationFromQuaternion(q), null);

  // lane markings: grid streets and the ring boulevard
  const white = toon('#ffffff');
  for (let k = -K; k <= K; k++) for (let t = -Lin; t <= Lin; t += 0.2) {
    const s = k * P;
    if (Math.hypot(s, t) > Lin) continue;
    world.add(DASH, white, frm(s, t, 0.002), null);
    world.add(DASH, white, frameAt(at(t, s, 0.002), c.map(t, s), c.t1), null);
  }
  for (const [x, z] of circle(c.Lr + 0.07, 110)) {
    const [nx, nz] = [-z, x];
    world.add(DASH, white, frameAt(at(x, z, 0.002), c.map(x, z), c.map(x + nx * 0.01, z + nz * 0.01).sub(c.map(x, z))), null);
  }

  // blocks
  const pad = P - 2 * SW;
  c.maxH = 0;
  for (let i = -K; i < K; i++) for (let j = -K; j < K; j++) {
    const cx = (i + 0.5) * P, cz = (j + 0.5) * P;
    if (Math.hypot(Math.abs(cx) + P / 2, Math.abs(cz) + P / 2) > Lin) continue;
    const centrality = 1 - Math.hypot(cx, cz) / c.Lr;
    const park = rand() < 0.14;
    world.add(PAD, toon(park ? '#7bd85a' : '#ece3cf'), frm(cx, cz), 0.02);
    if (park) {
      for (let n = 0; n < 5; n++) {
        const x = cx + rr(-0.22, 0.22), z = cz + rr(-0.22, 0.22);
        addTree(world, at(x, z, 0.03), c.map(x, z), rr(0.8, 1.1));
      }
      continue;
    }
    if (rand() < 0.4) {
      c.maxH = Math.max(c.maxH, addBuilding(world, frm(cx, cz, 0.04), pad * 0.7, centrality));
    } else {
      for (const [ox, oz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        if (rand() < 0.12) continue;   // an empty lot now and then
        c.maxH = Math.max(c.maxH, addBuilding(world, frm(cx + ox * pad / 4, cz + oz * pad / 4, 0.04), pad / 2 * 0.78, centrality));
      }
    }
  }

  // suburbs on the grass around the city
  for (let n = 0; n < 70; n++) {
    const a = rr(0, Math.PI * 2), r = rr(c.Lr + 0.55, c.Lr + 2.2);
    const x = r * Math.cos(a), z = r * Math.sin(a), d = c.map(x, z), h = heightAt(d);
    if (h < R + 0.1) continue;
    const pos = d.clone().multiplyScalar(h - 0.02);
    if (rand() < 0.35) addHouse(world, frameAt(pos, d, randomDir()), rr(0.2, 0.28));
    else addTree(world, pos, d, rr(0.8, 1.2));
  }

  // traffic
  const loops = [new Loop(circle(c.Lr, 96, 1)), new Loop(circle(c.Lr + 0.14, 96, -1))];
  for (let tries = 0; tries < 60 && loops.length < 8; tries++) {
    const i1 = Math.floor(rr(-K, K)), i2 = i1 + 1 + Math.floor(rand() * 3);
    const j1 = Math.floor(rr(-K, K)), j2 = j1 + 1 + Math.floor(rand() * 3);
    const corners = [[i1, j1], [i2, j1], [i2, j2], [i1, j2]].map(([i, j]) => [i * P, j * P]);
    if (corners.some(([x, z]) => Math.hypot(x, z) > Lin - 0.05)) continue;
    const e = 0.065;   // lane offset from the centre line
    loops.push(new Loop([[i1 * P + e, j1 * P + e], [i2 * P - e, j1 * P + e], [i2 * P - e, j2 * P - e], [i1 * P + e, j2 * P - e]]));
  }
  loops.forEach((loop, li) => {
    const n = li < 2 ? Math.round(loop.total / 3) : 2;
    for (let k = 0; k < n; k++) {
      const color = pick([...PALETTE, '#ffffff', '#ffd93d']);
      let s = loop.total * k / n + rr(0, 0.3);
      const speed = rr(0.3, 0.45);
      if (!spawnTraffic) continue;
      const carDesc = addCarInstance(color);
      vehicles.car.push(carDesc);  // phantom Object3D: chase camera target + descriptor for tests
      movers.push((t, dt) => {
        s += speed * dt;
        // c.map and c.top are read live: layoutCities() replaces them on a resize.
        const [x, z] = loop.at(s), [x2, z2] = loop.at(s + 0.04);
        const up = c.map(x, z), pos = up.clone().multiplyScalar(c.top);
        const real = frameAt(pos, up, c.map(x2, z2).multiplyScalar(c.top).sub(pos));
        const mat = carDesc.hidden ? HIDDEN_CAR : real;   // a bombed car keeps driving, unseen, and returns

        // Keep the phantom chase-camera Object3D in sync with the instance transform.
        real.decompose(carDesc.position, carDesc.quaternion, carDesc.scale);

        // Update instance matrices for all car parts
        carInstances.bodies.mesh.setMatrixAt(carDesc.bodyIndex, mat);
        carInstances.bodies.mesh.instanceMatrix.needsUpdate = true;
        carInstances.inkBodies.mesh.setMatrixAt(carDesc.bodyIndex, mat);
        carInstances.inkBodies.mesh.instanceMatrix.needsUpdate = true;

        carInstances.cabs.mesh.setMatrixAt(carDesc.cabIndex, mat);
        carInstances.cabs.mesh.instanceMatrix.needsUpdate = true;
        carInstances.inkCabs.mesh.setMatrixAt(carDesc.cabIndex, mat);
        carInstances.inkCabs.mesh.instanceMatrix.needsUpdate = true;

        carInstances.wheels.mesh.setMatrixAt(carDesc.wheelIndex, mat);
        carInstances.wheels.mesh.instanceMatrix.needsUpdate = true;
        carInstances.inkWheels.mesh.setMatrixAt(carDesc.wheelIndex, mat);
        carInstances.inkWheels.mesh.instanceMatrix.needsUpdate = true;
      });
    }
  });
}

  new THREE.BoxGeometry(0.03, 0.24, 0.008).translate(0, 0.13, 0).rotateZ(i * Math.PI * 2 / 3)));

// first: boot. Creates the cars, trains and boats; a rebuild only moves them.
function buildScenery(first) {
  clearBatch(sceneryGroup);
  world.entries.length = 0;
  mills.clear(); MILLS.length = 0; HAMLETS.length = 0;

  CITIES.forEach(c => buildCity(c, first));

  // Build the track now that every city's c.maxH (tallest building) is known, so the
  // city-clearance viaduct logic in the TrainTrack constructor has real data to work with.
  // Train movers read trainTrack and TRAIN_SPEED live, so a new track moves them too.
  trainTrack = new TrainTrack(CITIES, TRAIN_CITY_ORDER);
  TRAIN_SPEED = trainTrack.total / 90;  // 90 seconds per lap
  buildTrainRail();
  if (first) initTrains();

  // countryside
  const targetTrees = Math.round(1700 * ((R / 10) ** 2));
  currentCountrysideTreeCount = 0;
  for (let k = 0, placed = 0; k < 60000 && placed < targetTrees; k++) {
    const d = randomDir(), h = heightAt(d), a = h - R;
    if (a < 0.12 || a > 1.05 || nearCity(d, 0.02)) continue;
    if (forestNoise(d) < -0.03) continue;   // clustered forests
    addTree(world, d.clone().multiplyScalar(h - 0.02), d, rr(0.7, 1.3));
    placed++;
    currentCountrysideTreeCount = placed;
  }
  // hamlets
  const targetHamlets = Math.round(40 * ((R / 10) ** 2));
  for (let k = 0, placed = 0; k < 6000 && placed < targetHamlets; k++) {
    const d = randomDir(), h = heightAt(d);
    if (h < R + 0.12 || h > R + 0.6 || nearCity(d, 0.05)) continue;
    addHouse(world, frameAt(d.clone().multiplyScalar(h - 0.02), d, randomDir()), rr(0.18, 0.26));
    HAMLETS.push(d);
    placed++;
  }
  world.build(sceneryGroup);

  // windmills
  for (let k = 0, placed = 0; k < 3000 && placed < 10; k++) {
    const d = randomDir(), h = heightAt(d);
    if (h < R + 0.15 || h > R + 0.7 || nearCity(d, 0.05)) continue;
    const mill = inked(TOWER, toon('#ffffff'), 0.012);
    frameAt(d.clone().multiplyScalar(h - 0.02), d, randomDir()).decompose(mill.position, mill.quaternion, mill.scale);
    const hub = inked(BLADES, toon('#ff6b6b'), 0.01);
    hub.position.set(0, 0.5, 0.07);
    mill.add(hub); mills.add(mill);
    MILLS.push({ hub, w: rr(1.5, 3) });
    placed++;
  }

  // boats: a circle of deep water each. The circle grows with R, so it is checked at
  // more points on a big planet: same spacing as 16 points at R=15.
  let placed = 0;
  const targetBoats = Math.round(7 * ((R / 10) ** 2));
  for (let k = 0; k < 2000 && placed < targetBoats; k++) {
    const d = randomDir(), ang = 0.16;
    const { map } = planeMap(d, R), r = R * Math.tan(ang);
    const n = Math.max(16, Math.round(16 * R / 15));
    if (circle(r, n).some(([x, z]) => heightAt(map(x, z)) > R - 0.15) || heightAt(d) > R - 0.15) continue;
    const color = pick(['#ff6b6b', '#ffffff', '#ffd93d', '#a66cff']);
    if (!BOATS[placed]) {
      if (!first) break;   // a rebuild moves the boot boats, never adds new ones
      const boat = new THREE.Group();
      boat.add(inked(HULL, toon(color), 0.01),
        inked(BOW, toon('#ffffff'), 0.01), inked(CABIN, toon('#ffffff'), 0.01),
        inked(STACK, toon('#ff3b3b'), 0.006), new THREE.Mesh(WAKE, wakeMat));
      scene.add(boat); vehicles.boat.push(boat);
      const b = { boat };
      BOATS.push(b);
      movers.push((t, dt) => {
        b.th += b.w * dt;
        const up = b.map(b.r * Math.cos(b.th), b.r * Math.sin(b.th));
        const ahead = b.map(b.r * Math.cos(b.th + b.w * 0.2), b.r * Math.sin(b.th + b.w * 0.2));
        const pos = up.clone().multiplyScalar(R - 0.015 + Math.sin(t * 2 + b.ph) * 0.008);
        frameAt(pos, up, ahead.sub(up)).decompose(boat.position, boat.quaternion, boat.scale);
      });
    }
    Object.assign(BOATS[placed], { map, r, th: rr(0, 6.28), w: rr(0.12, 0.2) * (rand() < 0.5 ? 1 : -1), ph: rr(0, 6) });
    placed++;
  }
  // Less water at this size than at boot: boats without a circle share one.
  for (let i = placed; placed && i < BOATS.length; i++) {
    const { map, r } = BOATS[i % placed];
    Object.assign(BOATS[i], { map, r });
  }
}

// ---------- train rail mesh ----------
function buildTrainRail() {
  const railMaterial = toon('#7a6a5a');  // brownish rail color
  const portalMaterial = toon('#2a2530');  // dark mouth of a tunnel
  const buried = (pos, up) => Math.max(heightAt(up), R) - pos.length() > 0.12;   // inside a hill, a mountain or under a city

  // Sample the track and add rail boxes; a portal wherever the track enters or leaves the ground
  const railSamples = Math.ceil(trainTrack.total / 0.15);  // sample every 0.15 world units
  let wasBuried = null;
  for (let i = 0; i < railSamples; i++) {
    const s = (i / railSamples) * trainTrack.total;
    const pos = trainTrack.at(s);
    const nextPos = trainTrack.at(s + 0.15);
    const up = pos.clone().normalize();
    const fwd = nextPos.clone().sub(pos).normalize();
    const inside = buried(pos, up);
    if (wasBuried !== null && inside !== wasBuried)
      world.add(PORTAL, portalMaterial, frameAt(pos.clone().addScaledVector(up, 0.12), up, fwd), 0.01);
    wasBuried = inside;
    if (inside) continue;   // nobody sees rails under the ground

    world.add(RAIL, railMaterial, frameAt(pos, up, fwd), 0.01);
  }
  // Pillars under the bridges.
  const pillars = Math.ceil(trainTrack.total / 0.6);
  for (let i = 0; i < pillars; i++) {
    const pos = trainTrack.at((i / pillars) * trainTrack.total), up = pos.clone().normalize();
    const ground = Math.max(heightAt(up), R) + 0.012, gap = pos.length() - ground - 0.05;   // +0.012: the city floor is that much above HC, so no pillar pokes through it
    if (gap < 0.1) continue;
    world.add(PILLAR, railMaterial, frameAt(up.clone().multiplyScalar(ground), up, new V3(0, 1, 0).cross(up).normalize(), 1, gap, 1), 0.01);
  }
}

  add(new THREE.CylinderGeometry(0.05, 0.034, 0.42, 12).rotateX(Math.PI / 2), color);
  add(new THREE.SphereGeometry(0.05, 12, 8).translate(0, 0, 0.21), color);
  add(new THREE.BoxGeometry(0.64, 0.018, 0.11).translate(0, -0.01, 0.03), '#ffffff');
  add(new THREE.BoxGeometry(0.22, 0.014, 0.06).translate(0, 0.01, -0.18), '#ffffff');
  add(new THREE.BoxGeometry(0.014, 0.1, 0.07).translate(0, 0.06, -0.18), color);
  add(new THREE.BoxGeometry(0.05, 0.03, 0.08).translate(0, 0.045, 0.08), '#cdefff', 0.008);
  const prop = add(new THREE.BoxGeometry(0.17, 0.018, 0.006), '#26233a', 0.006);
  prop.position.z = 0.265;
  g.userData.prop = prop;
  return g;
}

function stripes(a, b) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 4;
  const g = c.getContext('2d');
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? a : b; g.fillRect(i * 8, 0, 8, 4); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function makeBalloon(color, tex = stripes(color, '#ffffff')) {
  const b = new THREE.Group();
  const env = inked(ENVELOPE, toon('#ffffff', tex), 0.015);
  env.scale.y = 1.18;
  b.add(env, inked(SKIRT, toon(color), 0.01), inked(BASKET, toon('#b07a4a'), 0.008));
  return b;
}

  const [t1, t2] = tangentBasis(CITIES[0].dir);
  balloons.forEach((b, i) => {

    // that worst case for this training town (checked by simulating the dive at every

    const alt = Math.min(skyFloor(b.dir) + rr(1.2, 2.0), CEIL - 0.5);

    const d = tmp.copy(camera.position).normalize();
    let floor = Math.max(heightAt(d), R) + 0.25;
    for (const c of CITIES) if (d.angleTo(c.dir) < c.cap + 0.05) floor = Math.max(floor, HC + c.maxH + 0.3);
    if (camera.position.length() < floor) camera.position.setLength(floor);
    alt = camera.position.length() - R;
    // close to the ground, tip the view up towards the horizon
    camera.rotateX((1 - smooth(1.2, 7, alt)) * 1.05);
  } else {
    target.updateWorldMatrix(true, false);
    const c = target.userData.chase ?? CHASE[mode];
    // glide over the surface, never through the planet: blend direction and height separately
    const want = target.localToWorld(tmp.copy(c.off)), k = 1 - Math.exp(-dt * 4);
    const len = THREE.MathUtils.lerp(camera.position.length(), want.length(), k);
    camera.position.normalize().lerp(want.normalize(), k).setLength(len);
    camera.up.lerp(tmp2.setFromMatrixPosition(target.matrixWorld).normalize(), 1 - Math.exp(-dt * 5)).normalize();
    camera.lookAt(target.localToWorld(tmp.copy(c.look)));
    if (mode === 'game' && G.kind === 'kaiju') {   // a kaiju is taller than the plane's floor: keep the camera above the skyline
      const floor = skyFloor(tmp.copy(camera.position).normalize());
      if (camera.position.length() < floor) { camera.position.setLength(floor); camera.lookAt(target.localToWorld(tmp.copy(c.look))); }
    }
    alt = camera.position.length() - R;
  }
  camera.near = clamp(alt * 0.08, 0.01, 2);
  camera.updateProjectionMatrix();
  atmosphere.material.uniforms.fade.value = smooth(3, 8, alt);

  renderer.render(scene, camera);
}
// In test mode, nothing drives frame() but the test runner's own LW.frame(dt) calls.
// A live rAF loop running underneath would sneak extra, unaccounted frames in between
// a test's manual steps — this pane throttles rAF irregularly, so that showed up as
// a flaky test rather than a clean failure or a clean pass.
if (!TEST_MODE) renderer.setAnimationLoop(() => frame());
LW.frame = frame;
LW.renderer = renderer;  // expose for tests (quality.js: draw call counting)
// Live getters, not snapshots: applySize() reassigns R/NZ when the planet is resized.
Object.defineProperty(LW, 'R', { get: () => R, configurable: true });
Object.defineProperty(LW, 'NZ', { get: () => NZ, configurable: true });
LW.rawHeight = rawHeight;
LW.grassNoise = grassNoise;   // expose for tests (planet-v2 AC1: meadows and forests keep their size)
LW.forestNoise = forestNoise;
LW.heightAt = heightAt;   // expose for tests (planet-v2 AC3/AC4: the actual rendered terrain height, post city-flattening)
LW.CITIES = CITIES;
LW.addCarInstance = addCarInstance;   // expose for tests
LW.setCarsVisible = setCarsVisible;   // expose for tests: measure traffic's own draw-call cost
LW.controls = controls;   // expose for tests (planet-v2 AC3: zoom limits)
Object.defineProperty(LW, 'startCameraDistance', { get: () => START_CAMERA_DISTANCE, configurable: true });   // expose for tests (planet-v2 AC3: fits at start)
LW.atmosphere = atmosphere;   // expose for tests (planet-v2 AC4: clears atmosphere)
LW.moon = moon;
Object.defineProperty(LW, 'HC', { get: () => HC, configurable: true });
// live getter, not a snapshot: `mode` is reassigned by setMode() throughout the session
// (trains AC5: tests read LW.mode after clicking a Ride-menu item to confirm it switched)
Object.defineProperty(LW, 'mode', { get: () => mode, configurable: true });
LW.skyBalloons = skyBalloons;
// live getters: a resize rebuilds scenery (planet-v2 AC5 density checks)
LW.hamlets = HAMLETS;
Object.defineProperty(LW, 'countrysideTreeCount', { get: () => currentCountrysideTreeCount, configurable: true });
Object.defineProperty(LW, 'cloudCount', { get: () => cloudCount, configurable: true });
// Trains
Object.defineProperty(LW, 'trainTrack', { get: () => trainTrack, configurable: true });   // live: a resize builds a new track (trains AC1/AC2/AC4)
LW.scenery = { world: sceneryGroup, mills, clouds, inkMeshes: ALL_INK_MESHES };   // expose for tests (planet-size-scenery.js)
LW.destroy = e => world.destroy(e);   // planet-v2 AC6; the Kaiju smashes through this
LW.restoreScenery = () => world.restoreAll();
Object.defineProperty(LW, 'sceneryEntries', { get: () => world.entries, configurable: true });   // live: a resize rebuilds them
LW.worldBatch = world;   // expose for tests (trains AC3: rail mesh merged into batch)
LW.ready = true;   // last thing set: tests.html polls this before running checks
</script>
</body>
</html>
